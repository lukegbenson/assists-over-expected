# Single source of truth for every tunable parameter.
# Code must read values from here (via nba_assists.config) and never inline a constant.

paths:
  root: "."
  data: "data"
  raw: "data/raw"                 # 7z archives, one per game
  tracking: "data/tracking"       # one Parquet per game
  rosters: "data/tracking/_rosters"
  pbp: "data/pbp"
  windows: "data/windows"
  derived: "data/derived"
  models: "models"
  reports: "reports"

# --- Court geometry, in SportVU feet -----------------------------------------
court:
  length_x: 94.0
  width_y: 50.0
  baskets:
    left:  {x: 5.25,  y: 25.0}
    right: {x: 88.75, y: 25.0}
  rim_height_z: 10.0
  rim_radius: 0.75

# --- Sentinel values used by the raw feed ------------------------------------
sentinels:
  ball_team_id: -1
  ball_player_id: -1

# --- Tracking feed -----------------------------------------------------------
tracking:
  source_frame_rate_hz: 25.0      # native SportVU sampling rate
  players_on_court: 10            # per team; a frame also carries 1 ball row
  game_id_length: 10              # zero-padded string ids, e.g. "0021500431"

# --- Play-by-play ------------------------------------------------------------
pbp:
  no_player_sentinel: 0           # PLAYER2_ID/PLAYER3_ID value meaning "nobody" in this feed
  event_types:
    made_shot: 1
    missed_shot: 2
    free_throw: 3
    rebound: 4
    turnover: 5
    foul: 6
    violation: 7
    substitution: 8
    timeout: 9
    jump_ball: 10
    ejection: 11
    period_begin: 12
    period_end: 13
    replay: 18

# --- Tracking inventory / QA thresholds --------------------------------------
# Used by scripts/tracking_inventory.py to flag suspect games.
inventory:
  min_minutes_required: 40.0      # below this many minutes of frames, flag the game
  max_missing_frame_share: 0.02   # above this share missing a player or the ball, flag
  max_gap_running_s: 5.0          # a frame gap this long while game_clock is ticking, flag

# --- Makes / assist labeling QA ----------------------------------------------
# Used by scripts/build_makes.py to sanity-check the assist share it computes.
makes_qa:
  expected_assisted_share_min: 0.57
  expected_assisted_share_max: 0.60

# --- Rim-crossing detection ---------------------------------------------------
# Used by scripts/detect_makes.py to recover each make's true time from ball
# tracking, to measure play-by-play clock offset.
rim_detection:
  search_before_s: 5.5       # how far before clock_s to search, in game-clock seconds
  search_after_s: 2.0        # how far after clock_s to search, in game-clock seconds
  rim_radius_tol: 1.25       # max horizontal distance (ft) from a rim center to count as a crossing
  clock_check_s: 0.2         # lookback span for the clock-running check
  clock_min_drop_s: 0.1      # minimum game_clock drop required over clock_check_s
  buzzer_window_s: 3.0       # wider lookback used only when the clock reads 0 at the crossing

# --- Attack-direction detection ------------------------------------------------
# Used by scripts/attack_direction.py to determine, per game/period/team,
# which basket a team is attacking, from tracking data alone (no play-by-play).
attack_direction:
  sample_hz: 5.0            # frames per second voted on (every source_frame_rate_hz/sample_hz-th frame)
  shot_clock_min: 5.0       # seconds; exclude frames with shot_clock below this
  shot_clock_max: 18.0      # seconds; exclude frames with shot_clock above this
  hold_dist: 3.0            # ft; max horizontal distance from the ball to its nearest player to count as "holding" it
  hold_height: 9.0          # ft; max ball height to count as held, not mid-pass/shot
  min_share: 0.80           # vote_share below this makes a team-period's basket "unclear"
  min_votes: 200            # n_votes below this also makes a team-period's basket "unclear"
  min_votes_ot: 100         # lower n_votes bar for overtime periods (period > 4), which are shorter

# --- Window extraction ----------------------------------------------------------
# Used by scripts/build_windows.py to cut a fixed-end tracking window leading up
# to each detected make, for model input.
windows:
  end_buffer_s: 0.2          # seconds of real time kept after the rim crossing
  start_margin_s: 0.2        # seconds subtracted from the corrected previous-event time (errs later)
  after_prev_make_s: 0.3     # seconds after the previous make's own crossing, when used as the start anchor
  offset_nudge_s: 0.5        # added to offset_s (toward 0) before using it to correct a previous time
  max_window_s: 24.0         # keep at most this many trailing seconds of a window
  min_window_s: 0.4          # below this many seconds, exclude the make as "too short"
  min_start_coverage_s: 5.0        # a window missing tracking at its start is still kept if it has at least this many seconds
  min_start_coverage_fraction: 0.8  # ...or at least this share of the originally intended (game-clock) length
  include_shot_clock: true   # whether to store a per-frame shot_clock array

training:
  device: auto                    # auto | cpu | cuda | mps

# --- Randomness --------------------------------------------------------------
# Every stochastic step derives its seed from here.
seeds:
  global: 99
  numpy: 99
  torch: 99

# --- Runtime -----------------------------------------------------------------
runtime:
  parquet_compression: zstd
