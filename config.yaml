# Single source of truth for every tunable parameter.
# Code must read values from here (via nba_assists.config) and never inline a constant.

paths:
  root: "."
  data: "data"
  raw: "data/raw"                 # 7z archives, one per game
  tracking: "data/tracking"       # one Parquet per game
  rosters: "data/tracking/_rosters"
  pbp: "data/pbp"
  windows: "data/windows"
  derived: "data/derived"
  models: "models"
  reports: "reports"

# --- Court geometry, in SportVU feet -----------------------------------------
court:
  length_x: 94.0
  width_y: 50.0
  baskets:
    left:  {x: 5.25,  y: 25.0}
    right: {x: 88.75, y: 25.0}
  rim_height_z: 10.0
  rim_radius: 0.75

# --- Sentinel values used by the raw feed ------------------------------------
sentinels:
  ball_team_id: -1
  ball_player_id: -1

# --- Tracking feed -----------------------------------------------------------
tracking:
  source_frame_rate_hz: 25.0      # native SportVU sampling rate
  players_on_court: 10            # per team; a frame also carries 1 ball row
  game_id_length: 10              # zero-padded string ids, e.g. "0021500431"

# --- Play-by-play ------------------------------------------------------------
pbp:
  no_player_sentinel: 0           # PLAYER2_ID/PLAYER3_ID value meaning "nobody" in this feed
  event_types:
    made_shot: 1
    missed_shot: 2
    free_throw: 3
    rebound: 4
    turnover: 5
    foul: 6
    violation: 7
    substitution: 8
    timeout: 9
    jump_ball: 10
    ejection: 11
    period_begin: 12
    period_end: 13
    replay: 18

# --- Tracking inventory / QA thresholds --------------------------------------
# Used by scripts/tracking_inventory.py to flag suspect games.
inventory:
  min_minutes_required: 40.0      # below this many minutes of frames, flag the game
  max_missing_frame_share: 0.02   # above this share missing a player or the ball, flag
  max_gap_running_s: 5.0          # a frame gap this long while game_clock is ticking, flag

# --- Makes / assist labeling QA ----------------------------------------------
# Used by scripts/build_makes.py to sanity-check the assist share it computes.
makes_qa:
  expected_assisted_share_min: 0.57
  expected_assisted_share_max: 0.60

training:
  device: auto                    # auto | cpu | cuda | mps

# --- Randomness --------------------------------------------------------------
# Every stochastic step derives its seed from here.
seeds:
  global: 99
  numpy: 99
  torch: 99

# --- Runtime -----------------------------------------------------------------
runtime:
  parquet_compression: zstd
