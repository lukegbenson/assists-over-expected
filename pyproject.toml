[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-assists"
version = "0.1.0"
description = "Passing and assist modeling from SportVU tracking data"
requires-python = ">=3.12"
dependencies = [
    "py7zr",
    "pyarrow",
    "polars",
    "duckdb",
    "pandas",
    "numpy",
    "scikit-learn",
    "torch",
    "matplotlib",
    "statsmodels",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
